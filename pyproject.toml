[project]
name = "signalpost"
version = "0.3.0"
description = "Agent that builds sourced, refreshable profiles for Norwegian companies from an organisation number"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<0.29",
  "anthropic>=1.13,<2",
]

[project.scripts]
signalpost = "signalpost.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["signalpost"]
